[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wxserver"
version = "0.1.0"
description = "GRIB ingest (HRRR, RRFS) into Icechunk with nzthermo-derived fields, served to the Wx Analysis Console"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "zarr>=3.0",
  "icechunk>=2.0",
  "eccodes>=2.38",
  "eccodeslib",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic-settings>=2.2",
  # nzthermo is installed from GitHub; see Dockerfile (needs Cython 3.0.x, no build isolation)
]

[project.optional-dependencies]
test = ["pytest>=8", "moto[server]>=5"]

[tool.setuptools.packages.find]
include = ["wxserver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
