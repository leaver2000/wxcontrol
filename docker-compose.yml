# Wx Analysis Console: client (nginx) + server (FastAPI) + ingest worker + db (S3 object store for Icechunk)
#
#   cp .env.example .env && docker compose up --build
#   open http://localhost:8080
#
# The "db" is SeaweedFS running as a single-node S3 gateway. MinIO's community edition no longer
# publishes container images (Oct 2025), and Icechunk needs an S3 server that supports conditional
# writes (If-Match / If-None-Match), which SeaweedFS does.

x-wx-env: &wx-env
  WX_STORE: s3
  WX_S3_ENDPOINT: http://db:8333
  WX_S3_BUCKET: ${WX_S3_BUCKET:-wxdata}
  WX_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wxadmin}
  WX_S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-please}
  WX_S3_ALLOW_HTTP: "true"

# Ingest and API tuning (models, levels, forecast hours, strides, retention...) comes from .env;
# see .env.example. Every setting also has a default in server/wxserver/config.py.
x-wx-env-file: &wx-env-file
  - path: .env
    required: false

services:
  db:
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-wxadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-change-me-please}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"wx","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","List","Tagging","Write"]}]}
        EOF
        exec weed server -dir=/data -ip=db -ip.bind=0.0.0.0 -volume.max=0 -s3 -s3.port=8333 -s3.config=/tmp/s3.json
    volumes:
      - db-data:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API, for inspecting the Icechunk repo from the host
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  db-init:  # create the bucket once; Icechunk creates its repository inside it
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for i in $$(seq 1 30); do
          echo "s3.bucket.list" | weed shell -master=db:9333 >/tmp/b 2>&1 && break; sleep 2
        done
        grep -q "${WX_S3_BUCKET:-wxdata}" /tmp/b || echo "s3.bucket.create -name ${WX_S3_BUCKET:-wxdata}" | weed shell -master=db:9333
        echo "s3.bucket.list" | weed shell -master=db:9333
    restart: "no"

  ingest:
    build: ./server
    command: ["python", "-m", "wxserver.ingest", "loop"]
    env_file: *wx-env-file
    environment: *wx-env
    depends_on:
      db-init:
        condition: service_completed_successfully
    healthcheck:
      disable: true
    restart: unless-stopped

  server:
    build: ./server
    env_file: *wx-env-file
    environment:
      <<: *wx-env
      WX_CORS_ORIGINS: ${WX_CORS_ORIGINS:-*}
    depends_on:
      db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "${CLIENT_PORT:-8080}:80"
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
